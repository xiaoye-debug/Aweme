name: Build Non-Jailbreak Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Compile Dylib for iOS (arm64)
      run: |
        xcrun -sdk iphoneos clang -dynamiclib \
          -arch arm64 \
          -miphoneos-version-min=14.0 \
          -fobjc-arc \
          -framework UIKit -framework Foundation \
          AwemeClearLikes.m \
          -o AwemeClearLikes.dylib

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AwemeClearLikes-Dylib
        path: AwemeClearLikes.dylib
